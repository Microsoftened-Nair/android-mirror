plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

def androidSdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT") ?: (file("${System.getProperty('user.home')}/android-sdk").exists() ? "${System.getProperty('user.home')}/android-sdk" : null)
if (!androidSdkRoot) {
    throw new GradleException("Neither ANDROID_HOME nor ANDROID_SDK_ROOT environment variable is set.")
}

def androidJarPath = "${androidSdkRoot}/platforms/android-34/android.jar"
def androidJarFile = file(androidJarPath)
if (!androidJarFile.exists()) {
    throw new GradleException("Android SDK 34 framework jar not found at: ${androidJarPath}")
}

dependencies {
    compileOnly files(androidJarPath)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

task buildServerJar(type: Exec) {
    dependsOn compileJava

    def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
    def d8BinaryName = isWindows ? "d8.bat" : "d8"
    def d8Path = "${androidSdkRoot}/build-tools/34.0.0/${d8BinaryName}"
    def libsDir = file("${buildDir}/libs")

    workingDir projectDir
    executable d8Path

    doFirst {
        def d8File = file(d8Path)
        if (!d8File.exists()) {
            throw new GradleException("d8 binary not found at: ${d8Path}")
        }
        libsDir.mkdirs()

        def classFiles = fileTree("${buildDir}/classes/java/main").matching {
            include '**/*.class'
        }.files.collect { it.absolutePath }

        if (classFiles.isEmpty()) {
            throw new GradleException("No compiled class files found in ${buildDir}/classes/java/main")
        }

        def d8Args = ["--output", libsDir.absolutePath, "--lib", androidJarPath]
        d8Args.addAll(classFiles)
        setArgs(d8Args)
    }

    doLast {
        def dexFile = file("${libsDir}/classes.dex")
        if (!dexFile.exists()) {
            throw new GradleException("classes.dex was not generated by d8")
        }
        def serverJar = file("${libsDir}/server.jar")
        ant.zip(destfile: serverJar) {
            fileset(dir: libsDir) {
                include(name: 'classes.dex')
            }
        }
        dexFile.delete()
    }
}
